[mysql]
; ============================================================
;  库内数据 MySQL 连接配置（<客户名>）
;  只需要填 host / port / database / user / password，其余保持不动
;
;  ★ 这个文件含密码，不要外发、不要提交到公开仓库。
;    本项目的 git 仓库是私有的，但换机器/发人之前先想一下。
;
;  连不通时的表现：库内导出 ✗ → 对账判「库内未导」，退出码 4（不报警）
; ============================================================
host = <数据库地址>
port = 3306
database = <库名>
user = <账号>
password = <密码>
charset = utf8mb4
connect_timeout = 15
read_timeout = 300

[tables]
; 两张源表。
; standard 必填；simple 没有就【留空】，不要填假表名 ——
; 空表名拼出的 SQL 会报错，把「本来没有这一路」误报成「导出失败」。
; 留空后三处会明确跳过：库内导出.has_simple()、每日对账的导出步骤、契约.optional
standard = <标准投表名>
simple =
