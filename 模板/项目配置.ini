# =====================================================================
# 项目配置 · <客户名>数据监控  —— 只放「跨平台通用」的东西
#
# 两个文件分工：
#   本文件                      项目名 / 店铺 / 判定阈值 / 通知 / 运行时段
#   平台/<平台>/配置/<平台>.ini   平台账号组织码 / cookie 字段 / 浏览器实例
#
# 换平台 = 换掉 平台/ 下那一整个目录，本文件不动。
# 换项目（同平台）= 复制整个 数据监控 目录，改本文件 + 平台 ini。
#
# 刻意不放进来的东西（它们属于代码，不是配置）：
#   · 库内两条 SQL（含 {{}} 转义，放 ini 里改错一个字符没人发现）
#   · 判定逻辑本身、看板布局、告警文案
#   · MySQL 连接信息 → 在 数据/库内数据/连接配置.ini
#
# 改完自检：python 项目配置.py
# =====================================================================

[项目]
# 出现在看板标题、告警推送标题里。★ 必改
name = <客户名>


[平台]
# ★ 换平台只改这两行。路径规则：平台/<site>/<product>/
#   改完必须确认那个目录真的存在（适配脚本 + 配置都在里面），
#   否则开跑就报「找不到平台配置文件」。
#   同平台换客户 → 这两行不用动。
site = 小红书
product = 聚光


[店铺]
# 顺序 = 看板从左到右的列序，主店铺必须排第一。
# ★ 必须与库内 shop_name 逐字节一致，否则整店数据会被静默过滤掉，
#   表现成天天报「库内未导」，而人只会去查 RPA。
#   空格、大小写、全半角都算差异 —— 抄的时候直接从库内数据里复制。
list = <店铺1>, <店铺2>
# 主店铺：到货最晚、决定当天能不能判的那家
main = <店铺1>


# ★ 平台侧配置已拆出去，不在这里：
#     [平台账号] [凭证字段] [凭证A] [凭证B]  →  平台/<平台>/配置/<平台>.ini
#   换平台 = 换掉 平台/ 下那一整个目录，本文件不动。


[对账阈值]
# 判定容差 = max(abs_tol 元, 平台消耗 × rel_tol)
# abs_tol 取 10：实测尾差都在 ±0.15 内（ROUND(SUM(cost),2) 的取整误差），
# 而真实缺口是几千的量级 —— 阈值放在中间不会误伤。
abs_tol = 10.0
rel_tol = 0.0001

# 「库内采集中」判定：账户数 < 近 7 日中位数 × acc_min_ratio，
# 且 金额采集率 < acc_min_fill，两个条件同时满足才算 RPA 还没采完。
# ★ 缺口一个都不行：只看账户数会误伤真实停投
#   （2026-11-09 子账号A 28→19 账户，金额分毫不差，就是真停投）。
acc_min_ratio = 0.7
acc_min_fill = 0.85
# 中位数本身少于这么多账户的店不判（小店常年 1~4 个账户，判了全是噪声）
acc_min_base = 5

# 最近这么多分钟内还有数据入库 → 认为 RPA 还在写
ingest_fresh_min = 90
# 导出时刻距库内最后写入少于这么多分钟 → 整库正在重灌，当天所有差额都不判
ra_active_min = 10

# 入库时间.csv 超过这么多小时没更新 → 文件里的「最后写入时刻」已经失效。
# 只有 --no-db 或导出失败时才会回退去看它，这时必须挡住过期文件：
# 文件停更后 mtime 和文件内 max(last_created) 一起冻结，差值恒定，
# 会让 ra_active 永远为真、每天所有差额被静默跳过。
ingest_stale_h = 24


[通知]
# sso（登录会话 cookie）剩余不足这么多小时就单独推一条登录态提醒。
# 定 72 而不是 48：周末/长假可能不跑，48h 在「周五剩 60h → 周一已过期」
# 这种情况下一次都报不出来。
sso_warn_hours = 72


[运行时段]
# 允许「自动」运行的时钟区间，24 小时制。留空 = 不限制。
window = 08:00-23:00
#
# 为什么需要这道护栏（真实事故）：
#   任务计划开着「错过后尽快启动」(StartWhenAvailable)。Windows 更新半夜
#   自动重启后，系统会把当天已排定但没执行的时间点补跑一次。凌晨被拉起来时，
#   代理和浏览器都还没起 —— 一出网就 ProxyError，退出码 1，群里多一条误报。
#   更糟的情况是代理恰好自启成功：会拿凌晨抓的半成品去写表。
#
#   不在区间内 → 日志里写明原因后直接跳过，不取数、不推送、退出码 0。
#   要半夜手动排查，加 --force 绕过。


[自检]
# 「换客户 = 复制整个目录」之后跑一遍：python -m 监控内核.自检
# 它扫业务代码里还有没有残留上一个客户的字面量（店铺名 / 标题 / 通知文案）。
#
# 这类残留不会报错，只会让结果静默出错：
#   店铺名写死 → 按 [店铺] 过滤后查不到任何数据，结果全空
#   标题/通知写死 → 顶着别人名字发出去，翻群记录才发现
#
# ★ 只有「源头项目」可以留空。从别处复制出来的新客户必须填上一家的特征词：
#       forbid = 上一家名字,上一家的英文,上一家的子账号
#   跑通一次之后它就一直在守 —— 哪天有人从老项目拷代码回来，开跑就报错。
#   留空 = 不检查；注释和 docstring 不扫，历史踩坑记录照留。
forbid =


[提示]
# 本项目自己的业务知识，会追加在对应提示后面。写在这里而不是代码里 ——
# 共享代码要给下一个客户用，里面不能出现任何一家的店名或口径。
#   collecting = 「库内采集中」时追加的一句话，留空则只说通用提示。
# 例：主店铺历来约 11:00~11:30 才到货，早上 11 点前手动跑最容易碰到
collecting =

[公共]
# 共用的那套代码（监控内核 + 平台取数 + 对账主流程）放在哪。
# 改代码只改那份，然后跑：
#     python ../../_公共/同步.py            # 预览
#     python ../../_公共/同步.py --apply    # 分发
# 每次开跑时会核对一次版本，过期或分发文件被手改会提示（只提示，不拦流程）。
# 留空或删掉这一段 = 不检查。
# 由 新建客户.py 按项目实际位置自动填好，一般不用改。
source = <公共源>
