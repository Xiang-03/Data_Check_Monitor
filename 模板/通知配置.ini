; ============================================================
; <客户名>数据监控 · 通知配置
; ============================================================
; 填了 url  → 告警推到这个企业微信群（群机器人）
; 留空      → 退回小助手（wecom-cli）
;
; ★ 每个客户单独一个群，不要和其他项目共用一个 webhook ——
;   否则 A 客户的告警会发到 B 客户的群里。
;
; 获取地址：企业微信群 → 右上角 … → 群机器人 → 添加机器人 → 复制 Webhook 地址
; 形如：    https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxxxxxxx-xxxx-xxxx
;
; 注意：这个 key 等于该群的发言权限，不要外发、不要提交到公开仓库。
; 想临时改回小助手：python 自动对账.py --via-cli
; ============================================================

[webhook]
url =
