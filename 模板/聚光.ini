# =====================================================================
# <平台> · 平台适配配置
#
# 这个文件只放「平台特有的东西」：账号组织码、cookie 字段、浏览器实例。
# 换平台 = 整个 平台/<平台名>/ 目录一起换，项目级的阈值/时段/通知
# 留在 数据监控/项目配置.ini，不用动。
#
# 同平台开新项目 → 复制这个文件，改组织码与端口即可。
#
# 读这个文件的是 数据监控/项目配置.py（组装器），改完自检：
#     python 项目配置.py
# =====================================================================

[平台账号]
# 格式：店铺名 = 组织码 | 归属凭证分组
#
# 一个分组 = 一个浏览器实例 = 一个登录的子账号。
# 接口按子账号隔离：A 只能看到 A 名下的店，B 只能看到 B 名下的店。
# 分组名要和下面的 [凭证A] / [凭证B] 对得上，对不上启动时就报错。
#
# ★ 店铺名必须与 [店铺] list 里的写法一致。
# ★ 只配一个分组也行 —— 那就删掉 [凭证B] 那一段。
<店铺1> = <组织码1> | A
<店铺2> = <组织码2> | A


[凭证字段]
# 换平台时改这一段：cookie 域名后缀、登录态判定字段、体检展示表。
# ★ 这一段是从旧平台抄过来时最容易忘记改的地方。
cookie_host_suffix = xiaohongshu.com
# 认定「这个窗口已登录」的最小凭证集合（逗号分隔）
login_proof = ads-mcc-sid, access-token-mcc.xiaohongshu.com
# 体检展示用，格式：cookie名 | 中文说明，分号分隔
watch = ads-mcc-sid | ③ 子账号会话（24h，最短命）; access-token-mcc.xiaohongshu.com | ② 平台令牌（24h）; customer-sso-sid | ① 平台登录会话（7d）; customerClientId | ① 设备信任（30d）


[凭证A]
# 一个浏览器实例。name 只用于日志和告警文案。
name = A 主店铺
# ★ 端口必须与机器上其它项目错开（同一个浏览器不会占用两个端口，但人容易配重）
port = <端口A>
# 数据/平台数据/ 下的 curl 模板文件名
curl = curl_a.txt
# Chrome / Edge（大小写不敏感）
browser = Chrome
# ★ 相对 数据监控/ 的路径，各项目必须用各自的 profile ——
#   复用会读到对方已登录的 cookie，取到别家的数，而且全程不报错。
profile = _browser/A


[凭证B]
name = B 其它店铺
port = <端口B>
curl = curl_b.txt
browser = Edge
profile = _browser/B
